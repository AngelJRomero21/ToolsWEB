<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formateador JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
        }
        button {
            margin-right: 10px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border: 1px solid #ccc;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #error {
            color: red;
            margin-top: 10px;
        }
        </style>
</head>
<body>
<h1>Formateador JSON</h1>
<p>Este es un formateador de JSON en línea. Puedes pegar tu JSON en el área de texto, hacer clic en "Formatear" y ver el resultado en un formato legible. También puedes copiar el resultado al portapapeles haciendo clic en "Copiar resultado".</p>

<textarea id="input" placeholder="Pega aquí tu JSON"></textarea>

<button id="format">Formatear</button>
<button id="copy">Copiar resultado</button>

<pre id="output"></pre>
<p id="error" role="status"></p>

<script>const input = document.querySelector("#input");
const output = document.querySelector("#output");
const error = document.querySelector("#error");

document.querySelector("#format").addEventListener("click", () => {
  try {
    const data = JSON.parse(input.value);
    output.textContent = JSON.stringify(data, null, 2);
    error.textContent = "";
  } catch {
    output.textContent = "";
    error.textContent = "El JSON introducido no es válido.";
  }
});

document.querySelector("#copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(output.textContent);
    error.textContent = "Resultado copiado.";
  } catch {
    error.textContent = "No se pudo copiar el resultado.";
  }
});</script>
</body>
</html>
